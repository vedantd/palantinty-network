<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Palantiny Network: independent nodes, shared regional signals</title>
<desc id="desc">Decorative illustration of several independent nodes joined by encrypted links. Experimental private synthetic research prototype, not a live public network.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b172a"/><stop offset=".58" stop-color="#142841"/><stop offset="1" stop-color="#141f38"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#29cdb0" stop-opacity=".25"/><stop offset="1" stop-color="#29cdb0" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#84acc6" stroke-width=".5" opacity=".16"/></pattern>
 <linearGradient id="link" x1="0" x2="1"><stop stop-color="#42ddbc"/><stop offset="1" stop-color="#85a7ff"/></linearGradient>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/>
<rect width="1200" height="330" rx="22" fill="url(#grid)"/>
<circle cx="1020" cy="156" r="260" fill="url(#glow)"/>
<g stroke="url(#link)" fill="none" stroke-width="2" opacity=".68">
 <path d="M770 164L897 86L1019 157L1117 67M770 164L874 247L1019 157L1123 255M897 86L1019 157L1123 255M874 247L1019 157"/>
</g>
<g fill="#101f34" stroke-width="3">
 <circle cx="770" cy="164" r="21" stroke="#50debc"/>
 <circle cx="897" cy="86" r="18" stroke="#8aa9ff"/>
 <circle cx="1019" cy="157" r="27" stroke="#50debc"/>
 <circle cx="1117" cy="67" r="17" stroke="#8aa9ff"/>
 <circle cx="874" cy="247" r="20" stroke="#50debc"/>
 <circle cx="1123" cy="255" r="19" stroke="#8aa9ff"/>
</g>
<g fill="#c9fff2">
 <circle cx="770" cy="164" r="5"/><circle cx="1019" cy="157" r="7"/><circle cx="874" cy="247" r="5"/>
</g><g fill="#d6e1ff"><circle cx="897" cy="86" r="4"/><circle cx="1117" cy="67" r="4"/><circle cx="1123" cy="255" r="4"/></g>
<g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
 <text x="54" y="103" font-size="53" font-weight="760" fill="#f5f9ff" letter-spacing="-1.6">Palantiny Network</text>
 <text x="56" y="149" font-size="21" font-weight="550" fill="#6ce7cb">Independent nodes. Shared regional signals.</text>
 <text x="56" y="195" font-size="17" fill="#b9c9df">Privacy-conscious, decentralized activity research</text>
 <text x="56" y="221" font-size="17" fill="#b9c9df">built on libp2p, signed reports, and independent indexers.</text>
 <rect x="54" y="262" rx="12" width="293" height="33" fill="#243a4b" stroke="#396d69"/>
 <text x="71" y="283" font-size="12" font-weight="700" letter-spacing=".5" fill="#a1f7e1">EXPERIMENTAL · SYNTHETIC-ONLY</text>
</g></svg>
