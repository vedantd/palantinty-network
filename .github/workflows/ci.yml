name: test
on:
  push:
  pull_request:
# PR code must not inherit a writable repository token.
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install integrity-pinned production dependencies (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check locked npm package provenance and integrity metadata
        run: npm run build:lock-check
      - name: Generate offline CycloneDX SBOM from locked Node dependencies
        run: |
          mkdir -p build
          npm sbom --sbom-format=cyclonedx --omit=dev > build/npm-sbom.cyclonedx.json
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("build/npm-sbom.cyclonedx.json"));if(x.bomFormat!=="CycloneDX"||!Array.isArray(x.components)||x.components.length<100) process.exit(1);console.log("CycloneDX components:",x.components.length)'
      - name: Retain lock-derived CI SBOM (evidence, not a signed release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: h1b-node-locked-cyclonedx-sbom
          path: build/npm-sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 14
      - run: timeout 90s npm test
      - name: Validate execution DAG and public release gates
        run: npm run release:plan-check
      - name: Confirm both public release profiles remain gated
        run: |
          npm run release:check -- open-synthetic-testnet --assert-blocked
          npm run release:check -- public-real-sensing --assert-blocked
      - run: npm run demo
      - run: npm run network:demo
      - run: npm run network:durable
      - run: npm run network:gossip
      - run: timeout 35s npm run network:synthetic
      - run: npm run network:reconnect
      - run: npm run network:replay
      - run: timeout 35s npm run network:dht
      - name: Verify two cryptographic region indexers via private Kademlia provider CID
        run: timeout 80s npm run network:region-dht
      - name: Verify signed two-indexer synthetic regional quorum, missing and divergent data
        run: timeout 90s npm run network:region-query
      - name: Exercise three-indexer DHT quorum and stopped-peer disagreement safety
        run: timeout 90s npm run network:region-resilience
      - name: Verify signed DHT indexer recovery after same-key/new-port restart
        run: timeout 110s npm run network:region-restart
      - run: timeout 35s npm run network:indexer-sync
      - run: timeout 35s npm run network:auto-sync
      - name: P02c synthetic peers across isolated private bridge containers
        run: |
          docker compose -f deploy/compose.p02c.yml down --volumes --remove-orphans
          timeout 100s docker compose -f deploy/compose.p02c.yml up --build --abort-on-container-exit --exit-code-from observer
      - name: Tear down P02c isolated private test
        if: always()
        run: docker compose -f deploy/compose.p02c.yml down --volumes --remove-orphans
      - name: M10 isolated private-container network
        run: |
          docker compose -f deploy/compose.m10.yml down --volumes --remove-orphans
          set -o pipefail
          PALANTINY_M10_RUN_ID=first timeout 150s docker compose -f deploy/compose.m10.yml up --build --abort-on-container-exit --exit-code-from replica 2>&1 | tee /tmp/palantiny-m10-first.log
          docker compose -f deploy/compose.m10.yml down --remove-orphans
          PALANTINY_M10_RUN_ID=second timeout 150s docker compose -f deploy/compose.m10.yml up --build --abort-on-container-exit --exit-code-from replica 2>&1 | tee /tmp/palantiny-m10-second.log
          node apps/m10-verify-restart.mjs /tmp/palantiny-m10-first.log /tmp/palantiny-m10-second.log
      - name: Tear down private-container test
        if: always()
        run: docker compose -f deploy/compose.m10.yml down --volumes --remove-orphans
