name: test
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run demo
      - run: npm run network:demo
      - run: npm run network:durable
      - run: npm run network:gossip
      - run: npm run network:reconnect
      - run: npm run network:replay
      - run: timeout 35s npm run network:dht
