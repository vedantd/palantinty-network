# TEMPORARY trusted branch-only lockfile bootstrap.
# Delete before merge; untrusted pull requests never get a write token.
name: h1-lock-bootstrap-once
on:
  push:
    branches:
      - build/h1a-node-lockfile-20261107
permissions:
  contents: write
jobs:
  seed-lockfile:
    if: "!contains(github.event.head_commit.message, '[h1-seeded]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact package versions without lifecycle scripts
        run: |
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const f=require("./package-lock.json"); if(f.lockfileVersion!==3 || Object.keys(f.packages).length<100) process.exit(1)'
          sha256sum package-lock.json
      - name: Commit exact lockfile to authorized feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: seed generated Node 22 dependency lockfile [h1-seeded]'
          git push origin HEAD:refs/heads/build/h1a-node-lockfile-20261107
