name: m06-materialize (temporary)
on:
  push:
    branches: [feat/m06-insights-dashboard]
    paths: [scripts/m06-unpack.mjs]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore M06 source files
        run: node scripts/m06-unpack.mjs
      - name: Commit source files to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard-fixture.mjs src/dashboard-model.mjs src/dashboard-server.mjs apps/dashboard.mjs web/index.html web/styles.css web/app.js tests/dashboard.test.mjs tests/dashboard-fixture.test.mjs
          git commit -m 'feat(m06): add tested Insights dashboard source and fixtures'
          git push origin HEAD:feat/m06-insights-dashboard
